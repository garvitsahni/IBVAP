<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Arial, sans-serif">
<rect width="1280" height="720" fill="#0B0B0C"/>
<text x="40" y="42" font-size="22" font-weight="800" fill="#FFFFFF">IBVAP — Workflow</text>
<text x="40" y="62" font-size="12" fill="#9CA3AF">Dark serpentine • pastel blocks • deterministic path solid</text>
<defs><marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#9CA3AF"/></marker></defs>
<g stroke="#9CA3AF" stroke-width="1.6" fill="none" marker-end="url(#g)">
<!-- row1 -->
<line x1="190" y1="140" x2="250" y2="140"/>
<line x1="430" y1="140" x2="470" y2="140"/>
<line x1="560" y1="175" x2="560" y2="235"/><line x1="560" y1="235" x2="80" y2="235"/><line x1="80" y1="235" x2="80" y2="300"/>
<!-- row1b feed into match only -->
<!-- row2 -->
<line x1="240" y1="335" x2="270" y2="335"/>
<line x1="440" y1="335" x2="470" y2="335"/>
<line x1="640" y1="335" x2="665" y2="335"/>
<line x1="775" y1="385" x2="775" y2="500"/>
<!-- row3 -->
<line x1="640" y1="535" x2="670" y2="535"/>
<line x1="840" y1="535" x2="865" y2="535"/>
<line x1="975" y1="535" x2="1070" y2="535"/>
<line x1="920" y1="585" x2="920" y2="630"/>
<line x1="1150" y1="570" x2="1150" y2="625"/>
</g>
<g font-size="12" text-anchor="middle">
<!-- ROW1 -->
<rect x="40" y="110" width="150" height="60" rx="30" fill="#F5F1E8" stroke="#D6CFC0"/>
<text x="115" y="137" font-weight="700" fill="#111">Camera Feed</text><text x="115" y="153" font-size="10.5" font-weight="400" fill="#555">RTSP H.264 • 15fps</text>
<rect x="250" y="105" width="180" height="70" rx="12" fill="#EDE7FF" stroke="#8B5CF6"/>
<text x="340" y="130" font-weight="700" fill="#111">Detect &amp; Track</text><text x="340" y="147" font-size="10.5" font-weight="400" fill="#555">YOLOv8n + ByteTrack</text><text x="340" y="161" font-size="9.5" font-weight="400" fill="#777">conf≥0.5 • IoU • track_id</text>
<rect x="470" y="105" width="180" height="70" rx="12" fill="#DFF5EE" stroke="#14B8A6"/>
<text x="560" y="130" font-weight="700" fill="#111">Extract Re-ID</text><text x="560" y="147" font-size="10.5" font-weight="400" fill="#555">Embedding vector</text><text x="560" y="161" font-size="9.5" font-weight="400" fill="#777">OSNet 512-d • fp16</text>
<!-- ROW2 -->
<rect x="80" y="300" width="160" height="70" rx="12" fill="#DFF5EE" stroke="#14B8A6"/>
<text x="160" y="325" font-weight="700" fill="#111">Match Cameras</text><text x="160" y="342" font-size="10.5" font-weight="400" fill="#555">Cosine similarity</text><text x="160" y="356" font-size="9.5" font-weight="400" fill="#777">≥0.75 • FAISS 10k</text>
<rect x="270" y="300" width="170" height="70" rx="12" fill="#FDE8EF" stroke="#EC4899"/>
<text x="355" y="325" font-weight="700" fill="#111">Update Ledger</text><text x="355" y="342" font-size="10.5" font-weight="400" fill="#555">Footprint chain</text><text x="355" y="356" font-size="9.5" font-weight="400" fill="#777">PG • hash+prev_hash</text>
<rect x="470" y="300" width="170" height="70" rx="12" fill="#F5F1E8" stroke="#A8A29E"/>
<text x="555" y="325" font-weight="700" fill="#111">Evaluate ROI</text><text x="555" y="342" font-size="10.5" font-weight="400" fill="#555">Virtual fence check</text><text x="555" y="356" font-size="9.5" font-weight="400" fill="#777">polygon vs centroid</text>
<polygon points="720,285 800,335 720,385 640,335" fill="#FDF0D5" stroke="#D97706"/>
<text x="720" y="330" font-weight="700" fill="#111">Rule</text><text x="720" y="346" font-weight="700" fill="#111">Violated?</text>
<!-- ROW3 -->
<rect x="470" y="500" width="170" height="70" rx="12" fill="#FFF7ED" stroke="#EA580C"/>
<text x="555" y="525" font-weight="700" fill="#111">Fire Alert</text><text x="555" y="542" font-size="10.5" font-weight="400" fill="#555">Instant, deterministic</text><text x="555" y="556" font-size="9.5" font-weight="400" fill="#777">status=fired • &lt;100ms</text>
<rect x="670" y="500" width="170" height="70" rx="12" fill="#FDE8EF" stroke="#EC4899"/>
<text x="755" y="525" font-weight="700" fill="#111">Ledger Write</text><text x="755" y="542" font-size="10.5" font-weight="400" fill="#555">Hash-chained, sync</text><text x="755" y="556" font-size="9.5" font-weight="400" fill="#777">SHA256 • blocking</text>
<polygon points="920,485 1000,535 920,585 840,535" fill="#FDF0D5" stroke="#B45309"/>
<text x="920" y="530" font-weight="700" fill="#111">Operator</text><text x="920" y="546" font-weight="700" fill="#111">Confirms?</text>
<rect x="1070" y="500" width="170" height="70" rx="12" fill="#DFF5EE" stroke="#14B8A6"/>
<text x="1155" y="525" font-weight="700" fill="#111">AI Enrichment</text><text x="1155" y="542" font-size="10.5" font-weight="400" fill="#555">+ trajectory predict</text><text x="1155" y="556" font-size="9.5" font-weight="400" fill="#777">local LLM • async</text>
<rect x="830" y="630" width="180" height="52" rx="26" fill="#F5F1E8" stroke="#A8A29E"/>
<text x="920" y="660" font-weight="600" fill="#111">Log: False Positive</text>
<rect x="1060" y="625" width="190" height="60" rx="26" fill="#FFEDE5" stroke="#EA580C"/>
<text x="1155" y="649" font-weight="700" fill="#111">Alert: Dashboard + Patrol</text><text x="1155" y="665" font-size="10.5" font-weight="400" fill="#555">WS /alerts • LAN only</text>
</g>
<g font-size="10" fill="#9CA3AF" text-anchor="middle">
<text x="700" y="255">No raw video crosses edge→fusion • events+embeddings only</text>
</g>
</svg>