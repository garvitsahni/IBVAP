# MediaMTX configuration for simulated multi-camera RTSP streams
# This configures 3 simulated camera streams that can be fed with test footage

paths:
  cam1:
    # Source: will be overridden by ffmpeg push
    source: publisher
    sourceOnDemand: false
    runOnDemand: ffmpeg -re -stream_loop -1 -i /footage/cam1.mp4 -c copy -f rtsp rtsp://localhost:8554/cam1
    runOnDemandRestart: true

  cam2:
    source: publisher
    sourceOnDemand: false
    runOnDemand: ffmpeg -re -stream_loop -1 -i /footage/cam2.mp4 -c copy -f rtsp rtsp://localhost:8554/cam2
    runOnDemandRestart: true

  cam3:
    source: publisher
    sourceOnDemand: false
    runOnDemand: ffmpeg -re -stream_loop -1 -i /footage/cam3.mp4 -c copy -f rtsp rtsp://localhost:8554/cam3
    runOnDemandRestart: true

# API for monitoring
api:
  address: :9997

# Metrics
metrics:
  address: :9998

# Logging
logLevel: info
logFormat: json