# MediaMTX configuration for simulated multi-camera RTSP streams

logLevel: info

api: yes
apiAddress: :9997

metrics: yes
metricsAddress: :9998

paths:
  cam1:
    runOnDemand: ffmpeg -re -stream_loop -1 -i /footage/cam1.mp4 -c copy -f rtsp rtsp://127.0.0.1:8554/$MTX_PATH
    runOnDemandRestart: yes

  cam2:
    runOnDemand: ffmpeg -re -stream_loop -1 -i /footage/cam2.mp4 -c copy -f rtsp rtsp://127.0.0.1:8554/$MTX_PATH
    runOnDemandRestart: yes

  cam3:
    runOnDemand: ffmpeg -re -stream_loop -1 -i /footage/cam3.mp4 -c copy -f rtsp rtsp://127.0.0.1:8554/$MTX_PATH
    runOnDemandRestart: yes

  all_others:
